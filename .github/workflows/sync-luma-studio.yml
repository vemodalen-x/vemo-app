name: Sync published Luma Studio
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-luma-studio.yml
      - .github/sites-sync.py
  workflow_dispatch:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-luma-studio
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Import and verify published source
        shell: bash
        run: python3 .github/sites-sync.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Commit synchronized files
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync Luma Studio from published Sites release'
          git push origin HEAD:main
